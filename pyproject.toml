[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intelligence"
version = "0.1.0"
description = "Single-camera football analytics — incremental implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["av>=16,<17", "numpy>=2,<3"]
calibration = ["opencv-python-headless>=4.10,<6", "numpy>=2,<3"]
detection = ["av>=16,<17", "numpy>=2,<3", "ultralytics>=8.4,<9", "scipy>=1.15,<2", "gdown>=6,<7"]

backend = ["fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
football-intelligence = "football_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["football_intelligence*"]
